<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login con Google</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

    <h1>Iniciar sesión con Google</h1>

    <!-- Botón de Google -->
    <div id="g_id_onload"
         data-client_id="408544160200-7kfdasp7gg5927thgervh6lngfre2bcl.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    
    <div class="g_id_signin" data-size="large"></div>

    <script>
        function handleCredentialResponse(response) {
            // Decodificar el token de Google
            const payload = parseJwt(response.credential);
            
            // Enviar los datos al script de PHP para crear la sesión
            fetch('login_sesion.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre: payload.name,
                    email: payload.email,
                    foto: payload.picture
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    // Redirigir directo al home
                    window.location.href = 'home.php';
                } else {
                    alert("Error al iniciar sesión");
                }
            });
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>

</body>
</html>
